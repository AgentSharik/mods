plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'fallen-relics'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'Illusivec4'
        url = 'https://maven.theillusivec4.top/'
    }
}

// JEI API is compile-only: the Chat & Recipe Linker module is a soft integration
// and simply stays dormant when the player has no JEI installed.
dependencies {
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.+'
    // Curios API is compile-only: the angel ring flight is a soft integration
    // and stays dormant when the player has no Curios installed.
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.0+1.21.1:api'
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Generate the loader metadata from gradle.properties so the artifact has
// the exact Minecraft, NeoForge and mod versions used for this build.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

// Ensure generated metadata is refreshed after edits to Gradle properties.
tasks.named('processResources').configure {
    dependsOn(generateModMetadata)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
