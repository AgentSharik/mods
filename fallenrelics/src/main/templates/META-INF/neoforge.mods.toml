modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="AgentSharik"
description='''
Потерянные реликвии древности вновь обрели силу. Fallen Relics возвращает в новые версии Minecraft любимые механики, блоки и предметы из старых модов — те, что сегодня реализованы иначе (и не всегда хорошо) или вовсе исчезли из современных версий. Реликвии не требуют энергии: им хватает собственной, древней.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="functionalstorage"
type="optional"
versionRange="[1,)"
ordering="AFTER"
side="BOTH"
