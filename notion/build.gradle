plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    // the "-cloud" tag lives in mod_version; the jar is published as
    // angelring-1.21.1-<mod_version>.jar so it never mixes with our own builds
    archivesName = 'angelring-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'Illusivec4'
        url = 'https://maven.theillusivec4.top/'
    }
}

// Curios: compile-only API plus runtime dep, exactly as the addon README prescribes
dependencies {
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.0+1.21.1:api'
    runtimeOnly 'top.theillusivec4.curios:curios-neoforge:9.5.0+1.21.1'
}

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
