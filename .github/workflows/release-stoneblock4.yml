name: Release StoneBlock 4 RU

# Собирает архив локализации из репозитория и прикрепляет к релизу.
# v1.1.33: IPN 2.2.5, libIPN 6.6.3 и фикс pick-block включены в mods архива.
# v1.1.32: русская книга DimDungeons использует data components вместо устаревшего NBT.
# v1.1.31: русский перевод окна выбора уровня мира Apotheosis со стандартным шрифтом; исполняемый скрипт шрифта не используется.
# Срабатывает на push в релизную ветку при изменении этого файла или
# файла установки; также можно запустить вручную с ветки по умолчанию.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза'
        required: true
        default: 'StoneBlock4-ru-v1.1.33'
  push:
    branches:
      - 'arena/88cc25d2-mods'
    paths:
      - '.github/workflows/release-stoneblock4.yml'
      - 'Проекты/StoneBlock 4/документация/release/УСТАНОВКА.txt'
      - 'Проекты/StoneBlock 4/документация/release/kubejs/**'
      - 'Проекты/StoneBlock 4/документация/release/config/**'
      - 'Проекты/StoneBlock 4/документация/echo_ru_voice.tsv'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || 'StoneBlock4-ru-v1.1.33' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build release archive
        run: |
          set -euo pipefail
          SB4="Проекты/StoneBlock 4"
          python3 scripts/build_ipn_pick_block_fix.py --check
          mkdir -p pkg/mods pkg/config/ftbquests/quests/lang
          cp "$SB4"/*.jar pkg/mods/
          test "$(find pkg/mods -maxdepth 1 -name '*.jar' | wc -l)" -eq 411
          for excluded in \
            leaderboards-1.21.1-NeoForge-2.0.4.jar \
            statuseffectbars-1.21.1-NeoForge-1.0.2.jar \
            synesthesia-1.21.1-NeoForge-1.1.0.jar; do
            test ! -e "pkg/mods/$excluded"
          done
          echo "Проверка: 411 JAR; 3 отдельных мода не включены в архив"
          FIX_DIR="Проекты/Исправления/IPN Pick Block Fix"
          cp "$FIX_DIR/IPN-PickBlock-Fix-neoforge-1.21.1-1.0.0.jar" pkg/mods/
          while IFS=$'\t' read -r fname url fsize fsha; do
            case "$fname" in ''|'#'*) continue ;; esac
            out="pkg/mods/$fname"
            curl -sSL --fail --retry 3 -o "$out" "$url"
            test "$(stat -c%s "$out")" = "$fsize"
            echo "$fsha  $out" | sha512sum -c -
          done < "$FIX_DIR/dependencies.tsv"
          test -f pkg/mods/kotlinforforge-5.12.0-all.jar
          test "$(find pkg/mods -maxdepth 1 -name '*.jar' | wc -l)" -eq 414
          echo "Проверка: 411 переведённых JAR + IPN + libIPN + фикс = 414 JAR"
          cp "$SB4/документация/_ftbquests_wip/ru_ru.snbt" pkg/config/ftbquests/quests/lang/ru_ru.snbt
          mkdir -p pkg/config/ftbquests/quests/chapters
          cp "$SB4/документация/release/config/ftbquests/quests/chapters/"*.snbt pkg/config/ftbquests/quests/chapters/
          test -f pkg/config/ftbquests/quests/chapters/general_magic.snbt
          mkdir -p pkg/config/fancymenu/assets/buttons
          cp "$SB4/документация/release/config/fancymenu/"*.txt pkg/config/fancymenu/
          cp "$SB4/документация/release/config/fancymenu/assets/buttons/"*.png pkg/config/fancymenu/assets/buttons/
          test -f pkg/config/fancymenu/title_screen_button.txt
          test -f pkg/config/fancymenu/assets/buttons/singleplayer.png
          mkdir -p pkg/config/apotheosis
          cp "$SB4/документация/release/config/apotheosis/names.cfg" pkg/config/apotheosis/names.cfg
          test -f pkg/config/apotheosis/names.cfg
          mkdir -p pkg/config/collapsiblegroups/lang
          cp "$SB4/документация/release/config/collapsiblegroups/lang/ru_ru.json" pkg/config/collapsiblegroups/lang/ru_ru.json
          test -f pkg/config/collapsiblegroups/lang/ru_ru.json
          mkdir -p pkg/kubejs
          cp -r "$SB4/документация/release/kubejs/." pkg/kubejs/
          cp "$SB4/документация/release/УСТАНОВКА.txt" pkg/
          echo "JAR в архиве: $(ls pkg/mods/*.jar | wc -l)"
          echo "Файлов kubejs в архиве: $(find pkg/kubejs -type f | wc -l)"
          test -f pkg/kubejs/assets/ftb/lang/ru_ru.json
          test -f pkg/kubejs/client_scripts/ru_unicode_font.js
          node --check pkg/kubejs/client_scripts/ru_unicode_font.js
          echo "Проверка: старый скрипт шрифта перезаписан отключённым файлом"
          test -f pkg/kubejs/assets/oritech/guides/oritech/guide/_ru_ru/items/automating_recipes.md
          test "$(find pkg/kubejs/assets/oritech/guides/oritech/guide/_ru_ru -name '*.md' | wc -l)" -eq 4
          echo "Проверка: 4 русские страницы гайда Oritech присутствуют"
          python3 - <<'PY'
          import zipfile, json
          ipn_files = [
              'InventoryProfilesNext-neoforge-1.21.1-2.2.5.jar',
              'libIPN-neoforge-1.21.1-6.6.3.jar',
              'IPN-PickBlock-Fix-neoforge-1.21.1-1.0.0.jar',
          ]
          for name in ipn_files:
              with zipfile.ZipFile('pkg/mods/' + name) as z:
                  assert z.testzip() is None, name
          with zipfile.ZipFile('pkg/mods/' + ipn_files[0]) as z:
              target = z.read('org/anti_ad/mc/ipnext/event/LockedSlotKeeper.class')
          assert b'ignoredSelectedHotbarSlot' in target
          print('Проверка: IPN, libIPN и фикс целы; целевой класс LockedSlotKeeper присутствует')
          with zipfile.ZipFile('pkg/mods/sg_economy-1.0.5.jar') as z:
              data = z.read('net/sirgrantd/sg_economy/command/EconomyCommand.class')
          assert '§aВы отправили %s %s игроку %s.'.encode() in data
          assert '§aВы получили %s %s от %s.'.encode() in data
          assert b'You sent %s %s to %s.' not in data
          assert b'You received %s %s from %s.' not in data
          print('Проверка: зашитые сообщения SG Economy переведены')
          with zipfile.ZipFile('pkg/mods/Apotheosis-1.21.1-8.9.0.jar') as z:
              world_tier = z.read('dev/shadowsoffire/apotheosis/client/WorldTierSelectScreen.class')
              en = json.loads(z.read('assets/apotheosis/lang/en_us.json'))
              ru = json.loads(z.read('assets/apotheosis/lang/ru_ru.json'))
          assert world_tier.count(bytes([0x10, 100, 0x10, 24])) == 1
          assert world_tier.count(bytes([0x10, 127, 0x10, 20])) == 1
          assert bytes([0x10, 60, 0x10, 24]) not in world_tier
          assert bytes([0x10, 80, 0x10, 20]) not in world_tier
          print('Проверка: размеры кнопок Apotheosis из v1.1.26 сохранены')
          russian = {
              'title.apotheosis.select_world_tier': 'Выбор уровня мира',
              'text.apotheosis.world_tier.haven': 'Прибежище',
              'text.apotheosis.world_tier.haven.desc': 'Начало вашего пути',
              'text.apotheosis.world_tier.frontier': 'Рубеж',
              'text.apotheosis.world_tier.frontier.desc': 'Отправляйтесь в опасный мир',
              'text.apotheosis.world_tier.ascent': 'Подъём',
              'text.apotheosis.world_tier.ascent.desc': 'Начните восхождение к могуществу',
              'text.apotheosis.world_tier.summit': 'Вершина',
              'text.apotheosis.world_tier.summit.desc': 'Вы достигли вершины, но это ещё не конец',
              'text.apotheosis.world_tier.pinnacle': 'Пик',
              'text.apotheosis.world_tier.pinnacle.desc': 'Затеряйтесь среди грозовых горных вершин',
              'text.apotheosis.world_tier.difficulty': 'Сложность:',
              'button.apotheosis.haven': 'Прибежище',
              'button.apotheosis.frontier': 'Рубеж',
              'button.apotheosis.ascent': 'Подъём',
              'button.apotheosis.summit': 'Вершина',
              'button.apotheosis.pinnacle': 'Пик',
              'button.apotheosis.tier_locked': '%s (заблокировано)',
              'button.apotheosis.tier_advancement': 'Выполните достижение %s, чтобы разблокировать.',
              'button.apotheosis.activate_tier': 'Активировать уровень мира: %s',
              'button.apotheosis.already_activated': 'Этот уровень мира сейчас активен',
              'button.apotheosis.activate': 'Активировать',
              'button.apotheosis.activated': 'Активировано',
              'button.apotheosis.disabled': 'Отключено',
              'button.apotheosis.tier_changes_disabled': 'Ручное изменение уровней мира отключено в настройках.',
              'button.apotheosis.show_detailed_info': 'Подробности',
              'button.apotheosis.show_detailed_info.desc': 'Просмотр усилений существ, усилений игроков и редкостей',
              'button.apotheosis.inactive': 'Неактивно',
              'button.apotheosis.locked': 'Этот уровень мира заблокирован',
              'button.apotheosis.open_world_tier_tutorial': 'Открыть обучение по уровням мира',
          }
          assert len(russian) == 30
          assert all(ru[key] == value for key, value in russian.items())
          assert ru['title.apotheosis.world_tier_details'] != en['title.apotheosis.world_tier_details']
          assert ru['text.apotheosis.world_tier_tutorial'] != en['text.apotheosis.world_tier_tutorial']
          print('Проверка: 30 надписей окна выбора уровня мира переведены, остальной перевод Apotheosis сохранён')
          disabled_font = open('pkg/kubejs/client_scripts/ru_unicode_font.js', encoding='utf-8').read()
          assert 'Java.loadClass' not in disabled_font
          assert 'ClientEvents.' not in disabled_font
          assert 'forceUnicode' not in disabled_font
          assert 'java.io.File' not in disabled_font
          print('Проверка: скрипт шрифта отключён и не изменяет настройки Minecraft')
          with zipfile.ZipFile('pkg/mods/simplyswords-neoforge-1.70.2-1.21.1.jar') as z:
              font = json.loads(z.read('assets/minecraft/font/default.json'))
              names = set(z.namelist())
          providers = font['providers']
          assert len(providers) == 11
          assert all(p['type'] == 'bitmap' for p in providers)
          assert not any(p['type'] == 'reference' for p in providers)
          for provider in providers:
              texture = 'assets/' + provider['file'].replace(':', '/textures/', 1)
              assert texture in names, texture
          print('Проверка: Simply Swords не дублирует стандартный шрифт; 11 иконок сохранены')
          with zipfile.ZipFile('pkg/mods/dimdungeons-210-neoforge-1.21.1.jar') as z:
              base = 'assets/dimdungeons/patchouli_books/guide_book/ru_ru/entries/'
              bell1 = json.loads(z.read(base + 'artifact_secret_bell_1.json'))
              bell2 = json.loads(z.read(base + 'artifact_secret_bell_2.json'))
          component = 'dimdungeons:item_secret_bell[dimdungeons:secret_bell_data='
          assert bell1['pages'][0]['item'] == component + '{upgrade:1,secret_x:0,secret_y:0,secret_z:0}]'
          assert bell2['pages'][0]['item'] == component + '{upgrade:2,secret_x:0,secret_y:0,secret_z:0}]'
          print('Проверка: обе русские страницы Колокола Секретов используют data components')
          with zipfile.ZipFile('pkg/mods/oritech-neoforge-1.21.1-1.2.13.jar') as z:
              designs = z.read('assets/oracle_index/books/oritech/translated/ru_ru/docs/reactor/designs.mdx').decode()
              redstone = z.read('assets/oracle_index/books/oritech/translated/ru_ru/content/resources/world/resource_node_redstone.mdx').decode()
          assert '| Тип стержня |' in designs
          assert '| Rod Type |' not in designs
          assert 'related_items: ["oritech:resource_node_lapis"' in redstone
          assert 'related_items: ["oritech:resource_node_lapis""' not in redstone
          print('Проверка: таблица реактора Oritech переведена, frontmatter исправен')
          PY
          echo "--- Русская озвучка Эхо (Google Drive) ---"
          mkdir -p pkg/kubejs/assets/ftb/sounds/echo/ru_ru
          test -f pkg/kubejs/assets/ftb/sounds.json
          n=0
          while IFS=$'\t' read -r fname fid fsize; do
            case "$fname" in ''|'#'*) continue ;; esac
            out="pkg/kubejs/assets/ftb/sounds/echo/ru_ru/$fname"
            curl -sSL --fail --retry 3 -o "$out" "https://drive.google.com/uc?export=download&id=${fid}&confirm=t"
            test "$(head -c4 "$out")" = "OggS"
            test "$(stat -c%s "$out")" = "$fsize"
            n=$((n+1))
          done < "$SB4/документация/echo_ru_voice.tsv"
          echo "Файлов озвучки скачано: $n"
          test "$n" -eq 38
          cd pkg
          zip -0 -q -r ../StoneBlock.4.zip .
          test "$(zipinfo -1 ../StoneBlock.4.zip 'mods/*.jar' | wc -l)" -eq 414
          unzip -l ../StoneBlock.4.zip | grep -q "mods/InventoryProfilesNext-neoforge-1.21.1-2.2.5.jar"
          unzip -l ../StoneBlock.4.zip | grep -q "mods/libIPN-neoforge-1.21.1-6.6.3.jar"
          unzip -l ../StoneBlock.4.zip | grep -q "mods/IPN-PickBlock-Fix-neoforge-1.21.1-1.0.0.jar"
          echo "Проверка: 414 JAR в ZIP, включая IPN, libIPN и фикс pick-block"
          unzip -l ../StoneBlock.4.zip | grep -q "config/apotheosis/names.cfg"
          unzip -l ../StoneBlock.4.zip | grep -q "config/ftbquests/quests/chapters/general_magic.snbt"
          unzip -l ../StoneBlock.4.zip | grep -q "kubejs/assets/ftb/lang/ru_ru.json"
          unzip -l ../StoneBlock.4.zip | grep -q "kubejs/assets/oritech/guides/oritech/guide/_ru_ru/items/automating_recipes.md"
          echo "Проверка: lang и гайд Oritech присутствуют в архиве"
          unzip -l ../StoneBlock.4.zip | grep -q "kubejs/client_scripts/ru_unicode_font.js"
          echo "Проверка: отключённый скрипт шрифта включён в архив для перезаписи старого"
          unzip -l ../StoneBlock.4.zip | grep -q "kubejs/startup_scripts/ru_echo_sounds.js"
          test "$(grep -c "event.create('ftb:ru_ru/" ../pkg/kubejs/startup_scripts/ru_echo_sounds.js)" -eq 38
          unzip -l ../StoneBlock.4.zip | grep -q "kubejs/assets/ftb/sounds.json"
          test "$(unzip -l ../StoneBlock.4.zip | grep -c 'sounds/echo/ru_ru/.*\.ogg')" -eq 38
          echo "Проверка: sounds.json и 38 файлов русской озвучки Эхо в архиве"
          cd ..
          ls -la StoneBlock.4.zip

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --clobber \
            StoneBlock.4.zip \
            "Проекты/Исправления/IPN Pick Block Fix/IPN-PickBlock-Fix-neoforge-1.21.1-1.0.0.jar"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
