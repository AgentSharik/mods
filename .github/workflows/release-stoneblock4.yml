name: Release StoneBlock 4 RU

# Собирает архив локализации из репозитория и прикрепляет к релизу.
# v1.1.1 (доп.): папка kubejs, заголовок книги Psi, подписи NeoForge.
# Срабатывает на push в релизную ветку при изменении этого файла или
# файла установки; также можно запустить вручную с ветки по умолчанию.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза'
        required: true
        default: 'StoneBlock4-ru-v1.1.4'
  push:
    branches:
      - 'arena/88cc25d2-mods'
    paths:
      - '.github/workflows/release-stoneblock4.yml'
      - 'Проекты/StoneBlock 4/документация/release/УСТАНОВКА.txt'
      - 'Проекты/StoneBlock 4/документация/release/kubejs/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || 'StoneBlock4-ru-v1.1.4' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build release archive
        run: |
          set -euo pipefail
          SB4="Проекты/StoneBlock 4"
          mkdir -p pkg/mods pkg/config/ftbquests/quests/lang
          cp "$SB4"/*.jar pkg/mods/
          cp "$SB4/документация/_ftbquests_wip/ru_ru.snbt" pkg/config/ftbquests/quests/lang/ru_ru.snbt
          mkdir -p pkg/kubejs
          cp -r "$SB4/документация/release/kubejs/." pkg/kubejs/
          cp "$SB4/документация/release/УСТАНОВКА.txt" pkg/
          echo "JAR в архиве: $(ls pkg/mods/*.jar | wc -l)"
          echo "Файлов kubejs в архиве: $(find pkg/kubejs -type f | wc -l)"
          test -f pkg/kubejs/assets/ftb/lang/ru_ru.json
          cd pkg
          zip -0 -q -r ../StoneBlock.4.zip .
          unzip -l ../StoneBlock.4.zip | grep -q "kubejs/assets/ftb/lang/ru_ru.json"
          echo "Проверка: kubejs/assets/ftb/lang/ru_ru.json присутствует в архиве"
          cd ..
          ls -la StoneBlock.4.zip

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --clobber \
            StoneBlock.4.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
