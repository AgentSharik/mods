name: Release StoneBlock 4 RU

# Собирает архив локализации из репозитория и прикрепляет к релизу.
# Запуск вручную (Actions -> Release StoneBlock 4 RU -> Run workflow).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза'
        required: true
        default: 'StoneBlock4-ru-v1.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release archive
        run: |
          set -euo pipefail
          SB4="Проекты/StoneBlock 4"
          mkdir -p pkg/mods pkg/config/ftbquests/quests/lang
          cp "$SB4"/*.jar pkg/mods/
          cp "$SB4/документация/_ftbquests_wip/ru_ru.snbt" pkg/config/ftbquests/quests/lang/ru_ru.snbt
          cp "$SB4/документация/release/УСТАНОВКА.txt" pkg/
          cp "$SB4/документация/RELEASE_CONTENTS.md" pkg/СОСТАВ_ПЕРЕВОДА.md
          echo "JAR в архиве: $(ls pkg/mods/*.jar | wc -l)"
          cd pkg
          zip -0 -q -r ../StoneBlock.4.zip .
          cd ..
          sha256sum StoneBlock.4.zip > StoneBlock.4.sha256.txt
          ls -la StoneBlock.4.zip

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          gh release upload "$TAG" --clobber \
            StoneBlock.4.zip \
            StoneBlock.4.sha256.txt \
            "Проекты/Отдельные моды/Axiom-6.1.3-for-MC1.21.1.jar"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.tag }}" --draft=false --latest
