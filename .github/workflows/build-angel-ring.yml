name: Build Angel Ring

on:
  push:
    branches:
      - arena/88cc25d2-mods
    paths:
      - '.github/workflows/build-angel-ring.yml'
      - 'Проекты/Отдельные моды/angel-ring-addon/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Проекты/Отдельные моды/angel-ring-addon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Verify jar
        run: |
          unzip -t build/libs/angelring-1.0.0.jar
          unzip -l build/libs/angelring-1.0.0.jar | grep 'META-INF/neoforge.mods.toml'
          unzip -l build/libs/angelring-1.0.0.jar | grep 'assets/angelring/lang/ru_ru.json'
          unzip -l build/libs/angelring-1.0.0.jar | grep 'data/curios/tags/item/ring.json'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=angel-ring-v1.0.0
          JAR=build/libs/angelring-1.0.0.jar
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --target "$GITHUB_SHA" \
              --title "Angel Ring 1.0.0 — NeoForge 1.21.1" \
              --notes "Готовая сборка мода Angel Ring для Minecraft 1.21.1 на NeoForge. Требуется Curios. Установка: поместите JAR в папку mods."
          fi
      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: angelring-1.0.0-neoforge-1.21.1
          path: Проекты/Отдельные моды/angel-ring-addon/build/libs/angelring-1.0.0.jar
          if-no-files-found: error
