name: Build Angel Ring

on:
  push:
    branches:
      - arena/88cc25d2-mods
    paths:
      - '.github/workflows/build-angel-ring.yml'
      - 'Проекты/Отдельные моды/angel-ring-addon/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Проекты/Отдельные моды/angel-ring-addon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: angelring-1.0.0-neoforge-1.21.1
          path: Проекты/Отдельные моды/angel-ring-addon/build/libs/angelring-1.0.0.jar
          if-no-files-found: error
