name: Extract video frames

# Ремесленный конвейер: раннер GitHub Actions не ограничен списком хостов песочницы,
# поэтому он сам тянет большое видео (например, из общего Drive по ссылке),
# режет его ffmpeg на кадры и коммитит кадры в ветку — песочница потом читает их поштучно.
# Запуск: закоммитить маркер frames/REQUEST-<имя> с содержимым "<drive_id> <every_N_seconds> <max_frames>".
on:
  push:
    paths:
      - 'frames/REQUEST-*'

permissions:
  contents: write

jobs:
  frames:
    name: Download and slice video
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Parse request marker
        id: req
        shell: bash
        run: |
          marker=$(ls frames/REQUEST-* | head -1)
          name="${marker#frames/REQUEST-}"
          read -r file_id every_n max_frames < "$marker"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "file_id=$file_id" >> "$GITHUB_OUTPUT"
          echo "every_n=${every_n:-2}" >> "$GITHUB_OUTPUT"
          echo "max_frames=${max_frames:-400}" >> "$GITHUB_OUTPUT"
          echo "request: $name id=$file_id every ${every_n:-2}s max ${max_frames:-400}"

      - name: Download video from Drive
        shell: bash
        run: |
          id="${{ steps.req.outputs.file_id }}"
          base="https://drive.usercontent.google.com/download?id=${id}&export=download"
          curl -L -c /tmp/cookies.txt -o /tmp/warn.html "${base}" || true
          uuid=$(grep -oE 'uuid=[0-9a-f-]+' /tmp/warn.html | head -1 | cut -d= -f2 || true)
          if [ -n "$uuid" ]; then
            echo "warning page uuid: $uuid"
            curl -L -b /tmp/cookies.txt --retry 3 -o /tmp/video.mp4 "${base}&confirm=t&uuid=${uuid}"
          else
            curl -L -b /tmp/cookies.txt --retry 3 -o /tmp/video.mp4 "${base}&confirm=t"
          fi
          size=$(stat -c%s /tmp/video.mp4 || echo 0)
          echo "downloaded bytes: $size"
          if [ "$size" -lt 1000000 ]; then
            echo 'Drive answer is too small, trying gdown'
            pip install --quiet --break-system-packages gdown || python3 -m pip install --quiet --user gdown
            rm -f /tmp/video.mp4
            gdown "${id}" -O /tmp/video.mp4
            size=$(stat -c%s /tmp/video.mp4 || echo 0)
            echo "gdown bytes: $size"
          fi
          {
            echo "size=$size"
            file /tmp/video.mp4
            head -c 200 /tmp/video.mp4 | base64 | head -5
            grep -oE 'uuid=[0-9a-f-]+' /tmp/warn.html | head -3
          } > /tmp/diag.txt || true
          file /tmp/video.mp4
          {
            echo '### Video probe'
            echo '```text'
            ffprobe -v error -show_entries format=duration -of default=nw=1 /tmp/video.mp4
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=nw=1 /tmp/video.mp4
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save diagnostics on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          cp /tmp/diag.txt ci-logs/video-diag.txt 2>/dev/null || true
          cp /tmp/warn.html ci-logs/video-warn.html 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-logs
          if ! git diff --cached --quiet; then
            git commit -m 'ci: video download diagnostics'
            git fetch origin "${GITHUB_REF_NAME}"
            git merge --no-edit "origin/${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

      - name: Extract frames
        shell: bash
        run: |
          mkdir -p "frames/${{ steps.req.outputs.name }}"
          ffmpeg -hide_banner -loglevel warning -i /tmp/video.mp4 \
            -vf "fps=1/${{ steps.req.outputs.every_n }},scale=960:-2" -q:v 4 \
            -frames:v "${{ steps.req.outputs.max_frames }}" \
            "frames/${{ steps.req.outputs.name }}/%04d.jpg" 2>/tmp/ffmpeg.log || true
          tail -30 /tmp/ffmpeg.log
          ls "frames/${{ steps.req.outputs.name }}" | wc -l
          du -sh "frames/${{ steps.req.outputs.name }}"

      - name: Save extract diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "ffmpeg log tail:"
            tail -40 /tmp/ffmpeg.log 2>/dev/null
            echo "frames dir:"
            ls -la "frames/${{ steps.req.outputs.name }}" 2>/dev/null | head -8
            du -sh "frames/${{ steps.req.outputs.name }}" 2>/dev/null
          } > ci-logs/video-extract.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-logs
          if ! git diff --cached --quiet; then
            git commit -m 'ci: video extract diagnostics'
            git fetch origin "${GITHUB_REF_NAME}"
            git merge --no-edit "origin/${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

      - name: Publish frames to the session branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q --ignore-unmatch 'frames/REQUEST-*' || true
          git add "frames/${{ steps.req.outputs.name }}"
          if git diff --cached --quiet; then
            echo 'No new frames.'
          else
            git commit -m "frames: ${{ steps.req.outputs.name }} (video round 3, every ${{ steps.req.outputs.every_n }}s)"
            git fetch origin "${GITHUB_REF_NAME}"
            git merge --no-edit "origin/${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
