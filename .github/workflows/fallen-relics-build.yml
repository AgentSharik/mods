name: Build Fallen Relics

on:
  push:
    paths:
      - 'fallenrelics/**'
      - 'cloud/**'
      - '.github/workflows/fallen-relics-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build NeoForge 1.21.1 JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build mod
        working-directory: fallenrelics
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain build 2>&1 | tee gradle-build.log
          result=${PIPESTATUS[0]}
          {
            echo '### Gradle build output (last 120 lines)'
            echo '```text'
            tail -n 120 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Build Cloud addon
        working-directory: cloud
        shell: bash
        run: |
          set +e
          ../fallenrelics/gradlew --no-daemon --stacktrace --console=plain build 2>&1 | tee gradle-build.log
          result=${PIPESTATUS[0]}
          {
            echo '### Cloud addon Gradle build output (last 120 lines)'
            echo '```text'
            tail -n 120 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Save build logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          cp fallenrelics/gradle-build.log ci-logs/mod-build.log 2>/dev/null || true
          cp cloud/gradle-build.log ci-logs/cloud-build.log 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-logs
          if ! git diff --cached --quiet; then
            git commit -m 'ci: save failing build logs'
            git fetch origin "${GITHUB_REF_NAME}"
            git merge --no-edit "origin/${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

      - name: Upload built JAR artifact
        uses: actions/upload-artifact@v5
        with:
          name: fallen-relics-neoforge-1.21.1
          path: fallenrelics/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish JARs to the session branch
        if: github.ref == 'refs/heads/arena/423851f4-mods'
        shell: bash
        run: |
          mod_ver="$(grep -E '^mod_version=' fallenrelics/gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          source_jar="fallenrelics/build/libs/fallen-relics-${mod_ver}.jar"
          published_jar="fallen-relics-neoforge-1.21.1-${mod_ver}.jar"
          test -f "$source_jar"
          cp "$source_jar" "$published_jar"
          find . -maxdepth 1 -type f -name 'fallen-relics-neoforge-1.21.1-*.jar' ! -name "$(basename "$published_jar")" -delete
          cloud_ver="$(grep -E '^mod_version=' cloud/gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          cloud_src="cloud/build/libs/angelring-1.21.1-${cloud_ver}.jar"
          cloud_pub="angelring-1.21.1-${cloud_ver}.jar"
          test -f "$cloud_src"
          cp "$cloud_src" "$cloud_pub"
          find . -maxdepth 1 -type f -name 'angelring-1.21.1-*.jar' ! -name "$(basename "$cloud_pub")" -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$published_jar" "$cloud_pub"
          git add -u -- 'fallen-relics-neoforge-1.21.1-*.jar' 'angelring-1.21.1-*.jar'
          if git diff --cached --quiet; then
            echo 'The committed JARs are already up to date.'
          else
            git commit -m 'Add built Fallen Relics and Cloud addon JARs'
            git fetch origin "${GITHUB_REF_NAME}"
            git merge --no-edit "origin/${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
