name: Build Auto-Packager add-on

on:
  push:
    paths:
      - 'autopackager/**'
      - '.github/workflows/autopackager-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build NeoForge 1.21.1 JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build mod
        working-directory: autopackager
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain build 2>&1 | tee gradle-build.log
          result=${PIPESTATUS[0]}
          {
            echo '### Gradle build output (last 120 lines)'
            echo '```text'
            tail -n 120 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Upload built JAR artifact
        uses: actions/upload-artifact@v5
        with:
          name: autopackager-neoforge-1.21.1
          path: autopackager/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish JAR to the session branch
        if: github.ref == 'refs/heads/arena/423851f4-mods'
        shell: bash
        run: |
          source_jar='autopackager/build/libs/autopackager-1.0.1.jar'
          published_jar='autopackager-neoforge-1.21.1-1.0.1.jar'
          test -f "$source_jar"
          cp "$source_jar" "$published_jar"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$published_jar"
          if git diff --cached --quiet; then
            echo 'The committed JAR is already up to date.'
          else
            git commit -m 'Add built Auto-Packager NeoForge 1.21.1 JAR'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
