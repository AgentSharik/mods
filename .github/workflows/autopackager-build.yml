name: Build Auto-Packager add-on

on:
  push:
    paths:
      - 'autopackager/**'
      - '.github/workflows/autopackager-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NeoForge 1.21.1 JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build mod
        working-directory: autopackager
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain build 2>&1 | tee gradle-build.log
          result=${PIPESTATUS[0]}
          {
            echo '### Gradle build output (last 120 lines)'
            echo '```text'
            tail -n 120 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: autopackager-neoforge-1.21.1
          path: autopackager/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
