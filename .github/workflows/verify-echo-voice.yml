name: Verify Echo Russian voice

on:
  push:
    branches:
      - arena/88cc25d2-mods
    paths:
      - '.github/workflows/verify-echo-voice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech recognizer
        run: pip install --quiet faster-whisper
      - name: Download the exact 38 release voice files
        run: |
          set -euo pipefail
          mkdir -p voice
          n=0
          while IFS=$'\t' read -r fname fid fsize; do
            case "$fname" in ''|'#'*) continue ;; esac
            out="voice/$fname"
            curl -sSL --fail --retry 3 -o "$out" "https://drive.google.com/uc?export=download&id=${fid}&confirm=t"
            test "$(head -c4 "$out")" = "OggS"
            test "$(stat -c%s "$out")" = "$fsize"
            n=$((n+1))
          done < "Проекты/StoneBlock 4/документация/echo_ru_voice.tsv"
          test "$n" -eq 38
      - name: Transcribe all voice files and detect language
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from faster_whisper import WhisperModel

          model = WhisperModel('small', device='cpu', compute_type='int8')
          rows = []
          for path in sorted(Path('voice').glob('*.ogg')):
              print('Transcribing', path.name, flush=True)
              segments, info = model.transcribe(
                  str(path), beam_size=5, vad_filter=True,
                  condition_on_previous_text=False,
              )
              text = ' '.join(part.text.strip() for part in segments).strip()
              rows.append((path.name, info.language, info.language_probability, text))

          out = [
              '# Проверка русской озвучки Эхо',
              '',
              'Автоматическая проверка содержимого всех 38 файлов с Google Drive владельца.',
              'Модель faster-whisper `small`, язык определяется автоматически по самому аудио.',
              'Расшифровка машинная и может содержать ошибки в отдельных словах; назначение проверки — подтвердить язык записей.',
              '',
              '| Файл | Язык | Вероятность | Расшифровка |',
              '|---|---|---:|---|',
          ]
          for name, lang, probability, text in rows:
              text = text.replace('|', '\\|').replace('\n', ' ')
              out.append(f'| `{name}` | {lang} | {probability:.3f} | {text} |')
          out += [
              '',
              f'Итого: {len(rows)} файлов; русский язык определён в {sum(lang == "ru" for _, lang, _, _ in rows)}.',
          ]
          target = Path('Проекты/StoneBlock 4/документация/echo_voice_verification.md')
          target.write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('\n'.join(out[-3:]))
          PY
      - name: Save verification report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "Проекты/StoneBlock 4/документация/echo_voice_verification.md"
          if ! git diff --cached --quiet; then
            git commit -m "Проверка озвучки Эхо: язык и расшифровка 38 записей"
            git push origin HEAD:refs/heads/arena/88cc25d2-mods
          fi
